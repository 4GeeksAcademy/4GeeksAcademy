      Elaboración y publicación de informes de análisis financiero y sectorial (energía, sector bancario, petróleo y gas) para Grupo Solfín.
  - role: Controlador Financiero
    time: "oct. 2021 - actualidad"
    company: MT Bakery
    details: |
      - Gestión integral del área administrativa, incluyendo la creación de precios finales, precios sugeridos y márgenes de ganancia, asegurando la rentabilidad del negocio.
      - Evaluación de costos fijos y variables, cálculo de depreciación de activos y estimación de pagos de préstamos para una correcta planificación financiera.
      - Negociación con clientes y elaboración de propuestas comerciales personalizadas para impulsar ventas y fortalecer relaciones comerciales.
      - Análisis de cuotas y ventas, monitoreo de rendimiento de clientes y evaluación de sensibilidad de precios para optimizar estrategias comerciales.
