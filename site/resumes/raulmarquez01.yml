  - role: Financial Planning & Performance Analyst
    time: "mar. 2025 - mar. 2026"
    company: Mondelēz International
    details: |
      - Gestión y optimización de esquemas de descuento (pronto pago, volumen, acuerdos comerciales y trade incentives) para maximizar sell-in y sell-out por canal y categoría.
      - Seguimiento y control financiero de descuentos comerciales, asegurando consistencia entre lo planificado y lo ejecutado.
      - Construcción de dashboards en Power BI para monitoreo de KPIs comerciales y toma de decisiones en tiempo real.
      - Soporte estratégico a equipos de Ventas y Trade Marketing mediante análisis de rentabilidad por cliente, canal y producto.
      - Interacción constante con el equipo comercial para levantar feedback de campo y ajustar estrategias de descuentos e incentivos.
      - Evaluación continua de la efectividad de promociones y acuerdos comerciales, identificando oportunidades de optimización.
  - role: Sales Intern
    time: "may. 2024 - dic. 2024"
    company: Mondelēz International
    details: |
      - Apoyo en la gerencia de volumen y ejecución y consolidación de descuentos por pronto pago, volumen y acuerdos comerciales.
      - Apoyo en la gestión y consolidación de acuerdos comerciales.
      - Análisis de ventas en las regiones de Centro y Occidente para sus diferentes canales, así como apoyo en la asignación de cuotas.
  - role: Risk Assurance Services Assistant
    time: "abr. 2023 - abr. 2024"
    company: PwC
    details: |
      - Asistencia en la supervisión y gestión de los procesos de Aseguramiento Limitado (NAAE) en el área de Gobierno, Riesgo y Cumplimiento (GRC) para clientes del sector financiero, específicamente en la Prevención y Control de Legitimación de Capitales y otros Ilícitos.
      - Responsable de garantizar el cumplimiento de las normativas emitidas por la Superintendencia de las Instituciones del Sector Bancario (SUDEBAN) y la Superintendencia del Sector Valores (SUNAVAL).
      - Participación en el desarrollo de proyectos en Risk Assurance Services (RAS), incluyendo la concepción de nuevos servicios y análisis de datos.
  - role: Guía de Campamento
    time: "jul. 2022 - sept. 2023"
    company: La Llanada
    details: |
      - Supervisión y cuidado integral de niños de 11 a 12 años durante una experiencia de campamento de tres semanas, fomentando su desarrollo personal y social en un entorno seguro y dinámico.
      - Liderazgo de actividades recreativas, deportivas y educativas, promoviendo el trabajo en equipo, la creatividad y el desarrollo de habilidades sociales.
      - Diseño y ejecución de juegos y dinámicas adaptadas a las necesidades y preferencias del grupo, asegurando una experiencia divertida y enriquecedora.
      - Manejo de situaciones de convivencia y resolución de conflictos, fortaleciendo la comunicación y el entendimiento mutuo entre los participantes.
      - Coordinación y trabajo en equipo con otros guías para garantizar una programación efectiva y el cumplimiento de los objetivos del campamento.
