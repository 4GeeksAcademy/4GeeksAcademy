# Your project portfolio
projects: 
    #title: > Prediction of 30-Day Readmission in Diabetic Patients
    intro: >
        Prediction of 30-Day Readmission in Diabetic Patients
        This project focused on applying Python-based classification algorithms to predict
        whether diabetic patients would be readmitted to the hospital within 30 days. 
        The objective was to leverage data-driven techniques to support healthcare
        decision-making through predictive modeling and improved feature interpretation..
    assignments:
      - Conducted research on the clinical and technical aspects of diabetes-related data,
       including pathology codes and treatment classifications used in the dataset.
      - Performed data cleaning, filtering and preprocessing to improve dataset quality
       and relevance.
      - Analyzed and interpreted medical variables to enhance feature understanding and
       contextual accuracy.
      - Contributed to the development and evaluation of classification models for 30-day
       readmission prediction.
      - Supported model interpretability by aligning technical data features with real-world 
       clinical meaning.
      
