          and improved the execution of executive lawsuits. My role required a deep understanding of legal frameworks and financial 
          operations, ensuring accuracy and compliance in all processes.

          - Pioneered content creation and editing strategies for legal and financial documents.
          - Streamlined legal procedures for mortgages and sales contracts, enhancing process efficiency.

    - role: Precenca
      time: 2013 - 2018
      company: Concrete pour coordinator
      # optional
      company_logo: ""
      details: |
          This is a highly specialized, logistics-heavy role focused on the "critical window" of a concrete placement. Because concrete is a perishable material that begins to chemically react and harden the moment it is mixed, the coordinator ensures nothing goes wrong during that multi-hour window.

      Key Responsibilities:

      Logistics & Timing: They manage the "staging" of concrete mixer trucks, ensuring a steady flow so the pour doesn't stop (which creates "cold joints" that weaken the structure).

      Quality Control: They oversee on-site testing, such as slump tests (measuring consistency) and the collection of test cylinders (to verify strength later in a lab).

      Crew Management: They act as the "air traffic controller" between the pump operators, the finishers, and the truck drivers.

      Safety & Compliance: Ensuring the formwork and rebar (the "skeleton") are clean and correctly positioned before the first drop of concrete hits the ground.


