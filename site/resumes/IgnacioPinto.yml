# Your previous education
education:
  - degree: Civil Engineering
    university: UNEFA
    university_logo: "" 
    time: 2008 - 2014
    details: |
      A Civil Engineer is a broader professional responsible for the conception, design, and structural integrity of the entire project. While a coordinator worries about the pour, the engineer worries about whether the structure can hold the weight it’s designed for over the next 50 years.

    Key Responsibilities:

        Design & Calculation: They use physics and advanced math to determine the required thickness of slabs, the amount of rebar needed, and the specific grade of concrete required.

        Planning & Permitting: They analyze soil reports, environmental impacts, and local building codes to ensure the project is legal and safe.

        Project Lifecycle: They are involved from the initial survey and CAD drafting (similar to your front-end wireframing) to the final inspection.

        Problem Solving: If a coordinator finds a mistake on-site, the Civil Engineer is the one who must calculate a technical solution to fix it.

